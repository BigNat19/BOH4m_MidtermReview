<h1>Business Leadership Midterm</h1>
<p class="sub">Units 1 and 2: management basics, planning tools, and leadership theory</p>
<nav><button data-t="guide">Study guide</button><button data-t="cards">Flashcards</button><button data-t="quiz">Quiz</button><button data-t="prac">Practice test</button></nav>
<main id="app"></main></div>
<script>
const tag=(t,c="")=>`<span class="tag ${c}">${t}</span>`;
const tags=(...a)=>`<div class="tags">${a.join("")}</div>`;
const PLAN_YES=tag("Planning tool ✓","yes"), PLAN_NO=tag("Not a planning tool","no");
// [category, title, body]
const G=[
["Unit 1 · Management basics","Functions of management (P-L-O-C)",tags(tag("Big category: Management Process"))+`<ul><li><mark>Planning</mark>: set objectives and decide what actions will reach them. <i>(SWOT and Porter's Five Forces are the planning tools.)</i></li><li><mark>Leading</mark>: arouse enthusiasm and direct people's efforts toward the plan.</li><li><mark>Organizing</mark>: assign tasks, allocate resources, and coordinate individuals and groups.</li><li><mark>Controlling</mark>: measure performance, compare it to the objectives, and take corrective action. Look at past data and results to make future decisions.</li></ul>`],
["Unit 1 · Management basics","Three skills of leadership",tags(tag("Big category: Leadership Skills"))+`<ul><li><mark>Technical</mark>: special expertise or training in an area.</li><li><mark>Human</mark>: working well with others.</li><li><mark>Conceptual</mark>: critical, analytical thinking; breaking down a problem and solving it.</li></ul><p>Upper-level managers rely most on <b>human and conceptual</b> skills.</p>`],
["Unit 1 · Management basics","Quality of work life: 6 indicators",tags(tag("Big category: Quality of Work Life (QWL)"))+`<p>QWL is an indicator of the overall quality of human experiences in the workplace.</p><ul><li>Fair pay (are you paid fairly for your experience?)</li><li>Safe working conditions (including mental health and having an HR)</li><li>Pride in the work and the organization</li><li>Protection of individual rights (what policies protect you?)</li><li>Opportunity to advance</li><li>Opportunity to be challenged and learn new skills</li></ul>`],
["Unit 1 · Management basics","Five areas of success",tags(tag("Big category: Five Areas of Success"))+`<ul><li><mark>Globalization</mark>: worldwide interdependence of resources, markets, and competition. Supplier relationships and expanding your market.</li><li><mark>Ethics</mark>: a code of moral principles. Good ethics toward the community (give back), customers (refund policy, good service), and employees.</li><li><mark>Technology</mark>: the Internet, computers, and IT keep transforming work; demand grows for knowledge workers who can use them.</li><li><mark>Intellectual capital</mark>: the collective brainpower of your workforce. Attract and retain quality employees: do people want to work there?</li><li><mark>Workplace diversity</mark>: differences in gender, age, race, ethnicity, religion, sexual orientation, and ability. Brings challenges and opportunities.</li></ul>`],
["Planning Tools","Planning tool: SWOT",tags(tag("Big category: Planning Tools"),PLAN_YES)+`<p><b>Yes, SWOT is a planning tool.</b> It supports the <mark>Planning</mark> function of P-L-O-C.</p><ul><li><mark>Strengths</mark> and <mark>weaknesses</mark> are <b>internal</b> factors.</li><li><mark>Opportunities</mark> and <mark>threats</mark> are <b>external</b> factors.</li></ul><p>List each, then use strengths, fix weaknesses, take opportunities, and guard against threats.</p>`],
["Planning Tools","Planning tool: Porter's Five Forces",tags(tag("Big category: Planning Tools"),PLAN_YES)+`<p><b>Yes, Porter's Five Forces is a planning tool.</b> It supports the <mark>Planning</mark> function of P-L-O-C.</p><p>Designed to determine whether you should move into a market. Mark each force + (good for you) or −. <mark>3 or more + is an attractive market; 2 or fewer is unattractive.</mark></p><ul><li><b>Buying power of consumers</b>: who has the power over price? Ideally your price is set and non-negotiable.</li><li><b>Buying power of suppliers</b>: do suppliers want to come to you?</li><li><b>Competitive intensity</b>: how hard existing firms compete.</li><li><b>Threat of substitutes</b>: indirect competition.</li><li><b>Threat of new entry</b>: regulatory issues, cost to enter, and whether someone bigger could come in.</li></ul>`],
["Classical Management","Classical Management: overview",tags(tag("Big category: Classical Management"))+`<p>Classical management is the <b>big category</b> for the early approaches that focused on <mark>efficiency</mark>, structure, and the best way to get work done.</p><p><b>Under Classical Management:</b></p><ul><li>Scientific management (Frederick Taylor), which includes <b>motion study</b> (the Gilbreths)</li><li>Bureaucratic management (Max Weber)</li></ul>`],
["Classical Management","Scientific management",tags(tag("Big category: Classical Management"),PLAN_NO)+`<p><b>This is under Classical Management.</b></p><p>Classical approach (Frederick Taylor): find the most efficient way to do work.</p><ul><li><mark>Economic incentives</mark>: pay linked to output.</li><li>Hire people with skill and <mark>train them</mark>.</li><li>Find the <mark>one best way</mark> to do each job.</li></ul><p><b>Motion study</b> (the Gilbreths), which is also under Classical Management as part of scientific management: look at how a job is done, break it into tasks, and improve proficiency.</p>`],
["Classical Management","Bureaucratic management",tags(tag("Big category: Classical Management"),PLAN_NO)+`<p><b>This is under Classical Management.</b></p><ul><li>Highly efficient.</li><li><mark>Hierarchy of authority</mark>.</li><li>Lots of rules and regulations (<mark>red tape</mark>), which act as checkpoints.</li><li>Also: division of labour, written records, and hiring by qualifications (Max Weber).</li></ul><p>Used today in government offices, the military, hospitals, and large universities.</p>`],
["Behavioural Management","Behavioural Management: overview",tags(tag("Big category: Behavioural Management"))+`<p>Behavioural management is the <b>big category</b> for approaches that focus on people: their needs, attitudes, and social relationships at work.</p><ul><li>Primary motivator: being part of a team and a culture of success.</li></ul><p><b>Under Behavioural Management:</b></p><ul><li>The Hawthorne studies (Elton Mayo)</li><li>Maslow's hierarchy of needs</li><li>McGregor's Theory X and Theory Y</li></ul>`],
["Behavioural Management","Hawthorne studies",tags(tag("Big category: Behavioural Management"),PLAN_NO)+`<p><b>This is under Behavioural Management.</b></p><ul><li>Led by <mark>Elton Mayo</mark> at the Western Electric Hawthorne plant.</li><li>Productivity rose when workers got <mark>attention and social support</mark>, not just because of changes like lighting or pay.</li><li><b>Hawthorne effect</b>: people perform better when they feel noticed and valued.</li><li>This started the <mark>human relations</mark> approach: social needs and group relationships affect performance.</li></ul><p><b>Workplace example:</b> a manager who checks in with the team, recognizes good work, and builds a friendly team culture sees output go up.</p>`],
["Behavioural Management","Maslow's hierarchy of needs",tags(tag("Big category: Behavioural Management"),PLAN_NO)+`<p><b>This is under Behavioural Management.</b></p><p>People are motivated by needs in order from the bottom up. Lower needs must be met before higher needs motivate. <mark>For the best results, cater to every level.</mark></p>
<div class="pyr" aria-label="Maslow's pyramid, top to bottom">
<div class="l5">5. Self-actualization<small>reach full potential</small></div>
<div class="l4">4. Esteem<small>respect and recognition</small></div>
<div class="l3">3. Social<small>belonging and friendship</small></div>
<div class="l2">2. Safety<small>security and stability</small></div>
<div class="l1">1. Physiological<small>basic survival needs</small></div>
</div>
<p class="sub">Bottom is the most basic need; top is the highest need.</p>
<div class="lvl"><h3>1. Physiological (bottom)</h3><p><b>Looking for:</b> basic survival needs such as food, water, rest, and shelter.</p><p><b>In the workplace:</b> a fair wage that covers living costs, reasonable hours, breaks, and a comfortable place to work.</p></div>
<div class="lvl"><h3>2. Safety</h3><p><b>Looking for:</b> security, stability, and protection from harm.</p><p><b>In the workplace:</b> job security, safe working conditions, health benefits, a pension, and clear policies that protect employees.</p></div>
<div class="lvl"><h3>3. Social</h3><p><b>Looking for:</b> belonging, friendship, and acceptance.</p><p><b>In the workplace:</b> teamwork, a friendly culture, team lunches or events, and good relationships with coworkers and the manager.</p></div>
<div class="lvl"><h3>4. Esteem</h3><p><b>Looking for:</b> respect, recognition, status, and confidence.</p><p><b>In the workplace:</b> praise for good work, an employee of the month award, a job title, a promotion, or a bonus.</p></div>
<div class="lvl"><h3>5. Self-actualization (top)</h3><p><b>Looking for:</b> reaching your full potential and personal growth.</p><p><b>In the workplace:</b> challenging projects, training and development, creative freedom, and the chance to lead or learn new skills.</p></div>`],
["Behavioural Management","McGregor's Theory X and Theory Y",tags(tag("Big category: Behavioural Management"),PLAN_NO)+`<p><b>This is under Behavioural Management.</b></p><ul><li><mark>Theory X</mark>: negative attitude; people dislike work and need control.</li><li><mark>Theory Y</mark>: positive attitude; people seek responsibility and are self-directed.</li><li><mark>Self-fulfilling prophecy</mark>: you treat employees the way you expect them to behave from the start, and they end up behaving that way.</li></ul>`],
["Modern Management","Quantitative management",tags(tag("Big category: Modern Management"),PLAN_NO)+`<p><b>This is under Modern Management.</b></p><p>Decisions are made on numbers and data (management science, statistics, modelling).</p>`],
["Modern Management","Contingency thinking (modern management)",tags(tag("Big category: Modern Management"),PLAN_NO)+`<p><b>This is under Modern Management.</b></p><p>There is not <b>one</b> best way to manage people. The best approach depends on the situation.</p>`],
["Leadership Styles","Blake and Mouton's leadership grid",tags(tag("Big category: Leadership Styles"),PLAN_NO)+`<p><b>Not a planning tool.</b> It is a leadership tool for describing a manager's style.</p><p>Concern for <b>relationships (people)</b> on the vertical axis, concern for <b>productivity</b> on the horizontal axis.</p><div class="gr"><div>Country club<br><small>high people, low production</small></div><div><mark>Team</mark><br><small>high on both: the ideal</small></div><div class="mid">Middle of the road: moderate on both</div><div>Impoverished<br><small>low on both</small></div><div>Authority-obedience<br><small>high production, low people</small></div></div>`]];
